<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이미정 선생님 마우스 연습실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f7ff; --card:#ffffff; --ink:#14213d; --muted:#46557a; --line:#cfdcf7;
  --blue:#3266e3; --blue2:#7466ff; --orange:#c9520f; --on-accent:#ffffff;
  --stage:#f6f9ff; --stage-line:#b9cdf4; --badge-bg:#fff1c2; --badge-ink:#8a3b00;
  --good:#1f9d55; --bad:#d64545;
  --mouse-body:#eef2fb; --mouse-edge:#b8c6e3; --wheel:#c8d1e0; --road:#dfe6f7; --road-dash:#ffffff;
  --glow:rgba(255,214,102,.30);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1530; --card:#172046; --ink:#eef2ff; --muted:#a9b6dc; --line:#2e3b70;
    --blue:#5b8cff; --blue2:#8b7bff; --orange:#ff9a55; --on-accent:#0b1230;
    --stage:#111a3b; --stage-line:#3a4b8a; --badge-bg:#4a3a12; --badge-ink:#ffdf8a;
    --good:#4cc47f; --bad:#ff7b7b;
    --mouse-body:#1d2a55; --mouse-edge:#3f5192; --wheel:#4a5b96; --road:#26336a; --road-dash:#4a5b96;
    --glow:rgba(255,214,102,.10);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1530; --card:#172046; --ink:#eef2ff; --muted:#a9b6dc; --line:#2e3b70;
  --blue:#5b8cff; --blue2:#8b7bff; --orange:#ff9a55; --on-accent:#0b1230;
  --stage:#111a3b; --stage-line:#3a4b8a; --badge-bg:#4a3a12; --badge-ink:#ffdf8a;
  --good:#4cc47f; --bad:#ff7b7b;
  --mouse-body:#1d2a55; --mouse-edge:#3f5192; --wheel:#4a5b96; --road:#26336a; --road-dash:#4a5b96;
  --glow:rgba(255,214,102,.10);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;font-weight:500;line-height:1.5;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.display{font-family:'Black Han Sans','Noto Sans KR','Malgun Gothic',sans-serif;font-weight:400;letter-spacing:.01em}

/* ---------- 상단 ---------- */
.top{max-width:1180px;margin:0 auto;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{background:none;border:0;padding:6px 4px;font-weight:800;font-size:18px;display:flex;gap:8px;align-items:center}
.ghost{background:var(--card);border:3px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:700;font-size:15px}
main{max-width:1180px;margin:0 auto;padding:0 24px 64px}

/* ---------- 마우스 그림 ---------- */
.mouse{position:relative;width:15.6em;height:10.6em;margin:0 auto;border:.4em solid var(--mouse-edge);border-radius:4.6em 4.6em 5.8em 5.8em;overflow:hidden;
  background:linear-gradient(180deg,var(--mouse-body) 0 52%,color-mix(in srgb,var(--mouse-body) 82%,var(--mouse-edge)) 100%);
  box-shadow:0 .9em 1.6em -.9em rgba(50,80,140,.45);font-size:15px}
.mouse.big{font-size:21px}
.mb{position:absolute;top:0;width:50%;height:5.5em;display:grid;place-items:center;font-weight:800;font-size:.95em;color:var(--ink);transition:background .15s,color .15s}
.mb.l{left:0;border-right:.2em solid var(--mouse-edge)}
.mb.r{right:0}
.mouse::after{content:'';position:absolute;left:0;right:0;top:5.5em;height:.2em;background:var(--mouse-edge);opacity:.55}
.wheel{position:absolute;left:50%;top:.8em;width:1.7em;height:3em;margin-left:-.85em;border-radius:.9em;background:var(--wheel);z-index:2;transition:background .15s}
.note{position:absolute;left:0;right:0;bottom:1.1em;text-align:center;font-weight:800;font-size:.95em;color:var(--muted)}
.mouse[data-mode~="left"] .l{background:var(--blue);color:var(--on-accent)}
.mouse[data-mode~="right"] .r{background:var(--orange);color:var(--on-accent)}
.mouse[data-mode~="wheel"] .wheel{background:var(--blue);animation:wheelbob .9s ease-in-out infinite}
.mouse[data-mode~="dbl"] .l{animation:dbl 1.1s ease-in-out infinite}
.mouse[data-mode~="hold"] .l{animation:pulse 1.2s ease-in-out infinite}
.mouse[data-mode~="drag"] .l{animation:pulse 1.4s ease-in-out infinite}
.mouse[data-mode~="move"]{animation:glide 1.8s ease-in-out infinite}
@keyframes wheelbob{0%,100%{transform:translateY(0)}50%{transform:translateY(.7em)}}
@keyframes dbl{0%,100%{filter:none}15%,45%{filter:brightness(1.35)}30%{filter:none}}
@keyframes pulse{0%,100%{filter:none}50%{filter:brightness(1.25)}}
@keyframes glide{0%,100%{transform:translateX(-.5em)}50%{transform:translateX(.5em)}}

/* ---------- 홈 ---------- */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;padding:24px 0 36px}
.hero h1{font-size:clamp(36px,5.4vw,64px);line-height:1.12;margin:0 0 16px}
.hero p{margin:0;color:var(--muted);font-size:clamp(16px,1.6vw,19px);max-width:30em}
.hero-mouse{text-align:center}
.hero-mouse .cap{margin:18px 0 0;font-weight:800;color:var(--muted);min-height:1.6em}
.lvl{font-size:22px;margin:32px 0 14px;display:flex;align-items:baseline;gap:10px}
.lvl small{font-size:15px;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.tile{position:relative;text-align:left;display:flex;gap:14px;align-items:center;padding:16px 18px;border:3px solid color-mix(in srgb,var(--tint) 55%,var(--line));border-radius:28px;background:color-mix(in srgb,var(--tint) 24%,var(--card));transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.t-emoji{font-size:40px;line-height:1;width:64px;height:64px;flex:none;display:grid;place-items:center;background:var(--card);border-radius:20px}
.t-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.t-body b{font-size:18px;font-weight:800}
.t-body small{font-size:14px;color:var(--muted);line-height:1.4}
.t-skill{display:inline-block;margin-top:4px;font-size:13px;font-weight:800;background:var(--card);border-radius:999px;padding:1px 10px;align-self:flex-start}
.t-done{position:absolute;top:10px;right:14px;width:26px;height:26px;border-radius:50%;background:var(--good);color:#fff;display:none;place-items:center;font-weight:800;font-size:15px}
.tile.done .t-done{display:grid}

/* ---------- 연습 화면 ---------- */
.crumb{padding:6px 0 14px}
.back{background:var(--card);border:3px solid var(--line);border-radius:999px;padding:6px 18px;font-weight:800}
.board{display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:28px;align-items:stretch}
.mission-card{background:linear-gradient(180deg,var(--card),color-mix(in srgb,var(--card) 60%,var(--stage)));border:3px solid var(--line);border-radius:38px;padding:22px 22px 26px;display:flex;flex-direction:column;gap:18px;align-items:center;box-shadow:0 18px 40px -26px rgba(50,102,227,.5)}
.title-row{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;justify-content:center}
.title-pill{margin:0;display:inline-flex;align-items:center;gap:12px;padding:6px 26px 6px 16px;border-radius:999px;background:var(--card);border:6px solid var(--line);font-size:clamp(24px,2.6vw,36px);line-height:1.25;transition:border-color .2s}
.title-pill[data-tone="left"]{border-color:color-mix(in srgb,var(--blue) 55%,var(--line))}
.title-pill[data-tone="right"]{border-color:color-mix(in srgb,var(--orange) 60%,var(--line))}
.title-pill .e{font-size:.95em}
.badge{background:var(--badge-bg);color:var(--badge-ink);font-weight:800;font-size:15px;padding:6px 16px;border-radius:999px}
.mission{margin:0;text-align:center;font-size:17px;font-weight:700;color:var(--muted)}
.mission b{color:var(--ink);font-weight:800}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line);transition:background .2s,transform .2s}
.dots i.on{background:var(--good);transform:scale(1.15)}
.dots span{font-weight:800;font-size:14px;color:var(--muted);margin-left:6px}

.stage{position:relative;min-height:480px;border:3px dashed var(--stage-line);border-radius:38px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  background:radial-gradient(circle at 10% 0%,var(--glow),transparent 46%),var(--stage)}
.bar{display:flex;flex-wrap:wrap;gap:16px 20px;align-items:center;margin-top:24px}
.primary{border:0;color:#fff;font-weight:800;font-size:20px;padding:16px 30px;border-radius:999px;background:linear-gradient(135deg,var(--blue),var(--blue2));box-shadow:0 12px 24px -10px rgba(70,90,240,.7)}
:root[data-theme="dark"] .primary{color:#0b1230}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .primary{color:#0b1230}}
.primary:active{transform:translateY(2px)}
#pHint{margin:0;font-size:19px;font-weight:800}

/* 공통 효과 */
.pop{animation:pop .38s ease}
.shake{animation:shake .38s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{translate:0}20%{translate:-10px}40%{translate:10px}60%{translate:-7px}80%{translate:7px}}

.win{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:color-mix(in srgb,var(--stage) 80%,transparent);backdrop-filter:blur(3px)}
.win-card{background:var(--card);border:4px solid var(--line);border-radius:32px;padding:28px 36px;text-align:center;animation:pop .5s ease;max-width:88%}
.win-card .we{font-size:64px;line-height:1.1}
.win-card h3{margin:6px 0 4px;font-size:32px}
.win-card p{margin:0 0 18px;color:var(--muted);font-weight:700}
.win-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.win-actions button{border:3px solid var(--line);background:var(--card);border-radius:999px;padding:10px 22px;font-weight:800;font-size:17px}
.win-actions button.main{background:linear-gradient(135deg,var(--blue),var(--blue2));border-color:transparent;color:#fff}
:root[data-theme="dark"] .win-actions button.main{color:#0b1230}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .win-actions button.main{color:#0b1230}}

/* ---------- 활동별 ---------- */
.big-target{position:absolute;width:150px;height:150px;padding:0;border:0;border-radius:50%;background:#fff;font-size:80px;line-height:1;display:grid;place-items:center;animation:glow 1.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 8px rgba(255,205,70,.35),0 0 30px 10px rgba(255,205,70,.5)}50%{box-shadow:0 0 0 18px rgba(255,205,70,.18),0 0 60px 24px rgba(255,205,70,.55)}}

.pic-card{position:absolute;inset:0;margin:auto;--s:clamp(200px,26vw,300px);width:var(--s);height:var(--s);background:#fff;border-radius:22%;box-shadow:0 26px 40px -16px rgba(50,80,140,.4);display:grid;place-items:center;font-size:calc(var(--s)*.44);line-height:1;cursor:pointer}

.doors{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,auto);gap:22px;place-content:center;--dw:clamp(84px,24vw,130px)}
.door{position:relative;width:var(--dw);height:calc(var(--dw)*1.5);padding:0;perspective:700px;border:6px solid #8a5a2b;border-bottom-width:8px;border-radius:14px 14px 3px 3px;background:#fff6d6;display:grid;place-items:center;overflow:visible}
.door .pic{font-size:calc(var(--dw)*.55);line-height:1}
.door .leaf{position:absolute;inset:0;background:linear-gradient(90deg,#c98a4a,#d9a066);transform-origin:left center;transition:transform .55s ease;border-radius:6px 6px 0 0}
.door .leaf i{position:absolute;right:12%;top:52%;width:12px;height:12px;border-radius:50%;background:#ffd166;box-shadow:0 0 0 2px #8a5a2b}
.door.open .leaf{transform:rotateY(-112deg)}
.door.open{cursor:default}

.balloon{position:absolute;bottom:-110px;width:68px;height:82px;padding:0;border:0;border-radius:50% 50% 48% 48%/58% 58% 42% 42%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.7) 0 9%,transparent 10%),var(--bc);font-size:0;animation:rise linear forwards}
.balloon::after{content:'';position:absolute;left:50%;top:100%;width:2px;height:46px;background:rgba(90,100,130,.6)}
.balloon.popped{background:none;font-size:52px;display:grid;place-items:center;animation-play-state:paused}
.balloon.popped::after{display:none}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(calc(-1*var(--h) - 240px))}}

.star{position:absolute;left:0;top:0;width:90px;height:90px;padding:0;border:0;background:none;display:grid;place-items:center;filter:drop-shadow(0 6px 10px rgba(255,170,0,.55))}
.star span{display:block;font-size:70px;line-height:1}

.sky{position:absolute;inset:0;background:
  radial-gradient(1.5px 1.5px at 20% 15%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 25%,#fff,transparent),
  radial-gradient(2px 2px at 45% 8%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 12%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 10% 40%,#fff,transparent),
  linear-gradient(#0d1745,#2f55d4 65%,#7fbfff)}
.ground{position:absolute;left:0;right:0;bottom:0;height:96px;background:#2f9e5b}
.rk{position:absolute;left:50%;bottom:150px;margin-left:-48px;width:96px;height:96px;display:grid;place-items:center;transition:transform 1.1s cubic-bezier(.5,0,1,.6)}
.rk span{display:block;font-size:76px;line-height:1;transform:rotate(-45deg)}
.rk.go{transform:translateY(-1000px)}
.meter{position:absolute;left:50%;bottom:116px;width:min(260px,72%);height:22px;transform:translateX(-50%);border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden;border:3px solid #fff}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd166,#ff6b3d)}
.pad{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:min(240px,70%);height:64px;border-radius:99px;border:0;background:#e63946;color:#fff;font-weight:800;font-size:20px;box-shadow:0 8px 0 #9d1f2b;touch-action:none}
.pad.down{transform:translate(-50%,6px);box-shadow:0 2px 0 #9d1f2b}

.path-svg{position:absolute;inset:0;width:100%;height:100%}
.road{fill:none;stroke:var(--road);stroke-width:68;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.road-dash{fill:none;stroke:var(--road-dash);stroke-width:4;stroke-dasharray:2 14;stroke-linecap:round}
.road-prog{fill:none;stroke:var(--blue);stroke-width:26;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:0 99999;opacity:0}
.path-svg.go .road-prog{opacity:.85}
.path-svg.fail .road{stroke:#f4b3b3}
.start-c{fill:var(--card);stroke:var(--blue);stroke-width:6}
.path-svg text{font-size:44px;text-anchor:middle;dominant-baseline:central}

.sort{position:absolute;inset:0;padding:22px;display:flex;flex-direction:column;gap:22px}
.baskets{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.basket{position:relative;min-height:130px;border:4px dashed var(--bc);border-radius:22px;background:color-mix(in srgb,var(--bc) 16%,var(--card));display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 6px;transition:transform .15s,background .15s}
.basket.hot{transform:scale(1.05);background:color-mix(in srgb,var(--bc) 34%,var(--card))}
.basket .bl{font-weight:800;color:var(--ink);font-size:16px}
.basket .in{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;font-size:26px;line-height:1.1;min-height:32px}
.basket .bn{position:absolute;top:-12px;right:-8px;background:var(--bc);color:#fff;border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-weight:800;font-size:14px}
.pile{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-content:center;flex:1}
.chip{width:78px;height:78px;border-radius:50%;background:#fff;box-shadow:0 8px 14px -6px rgba(50,80,140,.45);display:grid;place-items:center;font-size:44px;line-height:1;cursor:grab;touch-action:none;position:relative}
.chip.drag{cursor:grabbing;z-index:20;box-shadow:0 20px 26px -10px rgba(50,80,140,.55)}
.chip.back{transition:transform .28s cubic-bezier(.3,1.4,.6,1)}

.elev{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.elev::-webkit-scrollbar{display:none}
.floor{height:100%;scroll-snap-align:start;display:grid;place-items:center;text-align:center;background:var(--fc);color:#14213d}
.floor .fe{font-size:min(120px,22vh);line-height:1.1}
.floor .fn{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-size:44px}
.panel{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:3}
.panel span{width:42px;height:42px;border-radius:50%;background:var(--card);border:3px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--ink);transition:background .15s}
.panel span.here{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}
.goal{position:absolute;left:16px;top:16px;z-index:3;background:var(--card);border:3px solid var(--line);border-radius:999px;padding:8px 18px;font-weight:800;color:var(--ink)}

/* ---------- 반응형 ---------- */
@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .stage{min-height:420px}
  main{padding:0 16px 48px}
  .top{padding:12px 16px}
}
@media (max-width:520px){
  .baskets{gap:8px}
  .basket{min-height:110px}
  .chip{width:66px;height:66px;font-size:36px}
}
@media (prefers-reduced-motion: reduce){
  .big-target,.mouse,.mouse *,.pad,.win-card{animation:none!important}
  .door .leaf,.tile,.chip{transition:none!important}
}
</style>
</head>
<body>

<header class="top">
  <button class="brand" id="brand" aria-label="처음 화면으로">🖱️ <span>마우스 연습실</span></button>
  <button class="ghost" id="soundBtn" aria-pressed="true">🔊 소리 켬</button>
</header>

<main>
  <!-- 홈 -->
  <section id="home">
    <div class="hero" id="hero">
      <div>
        <h1 class="display">마우스, 이렇게<br>눌러요</h1>
        <p>클릭, 더블클릭, 끌어서 놓기, 휠 굴리기까지. 그림을 보고 따라 하면서 마우스와 친해져요.</p>
      </div>
      <div class="hero-mouse">
        <div class="mouse big" id="heroMouse" data-mode="">
          <div class="mb l"><span>왼쪽</span></div><div class="mb r"><span>오른쪽</span></div><div class="wheel"></div><div class="note"></div>
        </div>
        <p class="cap" id="heroCap" aria-live="polite">지금 마우스 버튼을 눌러 보세요. 그림도 함께 움직여요.</p>
      </div>
    </div>
    <div id="lists"></div>
  </section>

  <!-- 연습 -->
  <section id="practice" hidden>
    <div class="crumb"><button class="back" id="backBtn">← 처음으로</button></div>
    <div class="board">
      <aside class="mission-card">
        <div class="title-row">
          <h2 class="title-pill display" id="pTitle"><span class="e" id="pEmoji"></span><span id="pTitleText"></span></h2>
          <span class="badge" id="pBadge"></span>
        </div>
        <div class="mouse" id="pMouse" data-mode="">
          <div class="mb l"><span>왼쪽</span></div><div class="mb r"><span>오른쪽</span></div><div class="wheel"></div><div class="note"></div>
        </div>
        <p class="mission"><b>미션:</b> <span id="pMission"></span></p>
        <div class="dots" id="pDots" aria-live="polite"></div>
      </aside>
      <div class="stage" id="stage"></div>
    </div>
    <div class="bar">
      <button class="primary" id="againBtn">다시 하기</button>
      <p id="pHint" aria-live="polite"></p>
    </div>
  </section>
</main>

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const rand=(a,b)=>Math.random()*(b-a)+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- 소리 ---------- */
let soundOn=true, ac=null;
function tone(f,d=.12,type='sine',v=.08,delay=0){
  if(!soundOn) return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime+delay;
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+.03);
  }catch(e){}
}
const sfx={
  ok:()=>{tone(660,.1);tone(880,.14,'sine',.08,.08)},
  no:()=>tone(180,.2,'triangle',.1),
  pop:()=>tone(520,.08,'square',.04),
  win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.2,'sine',.08,i*.1))
};
$('#soundBtn').addEventListener('click',e=>{
  soundOn=!soundOn;
  e.currentTarget.textContent=soundOn?'🔊 소리 켬':'🔇 소리 끔';
  e.currentTarget.setAttribute('aria-pressed',String(soundOn));
});

/* ---------- 연습 화면 제어 ---------- */
const stage=$('#stage'), pMouse=$('#pMouse');
let cur=null, session=null;

function cleanup(){
  if(session){session.disposers.forEach(f=>{try{f()}catch(e){}});session=null}
  stage.innerHTML='';
  stage.removeAttribute('style');
}
function goHome(){
  cleanup(); cur=null;
  $('#practice').hidden=true; $('#home').hidden=false;
  window.scrollTo({top:0});
}
function next(){
  const i=ACTIVITIES.indexOf(cur);
  openActivity(ACTIVITIES[(i+1)%ACTIVITIES.length].id);
}
function openActivity(id){
  cur=ACTIVITIES.find(a=>a.id===id);
  $('#home').hidden=true; $('#practice').hidden=false;
  window.scrollTo({top:0});
  runActivity();
}
function runActivity(){
  cleanup();
  const act=cur, s={disposers:[],done:false};
  session=s;
  const api={
    stage,
    title(text,emoji,tone){ $('#pTitleText').textContent=text; $('#pEmoji').textContent=emoji||act.emoji; $('#pTitle').dataset.tone=tone||''; },
    badge(t){ $('#pBadge').textContent=t; },
    mission(t){ $('#pMission').textContent=t; },
    hint(t){ $('#pHint').textContent=t; },
    mouse(mode,note){ setMouse(pMouse,mode,note); },
    progress(n,total){
      $('#pDots').innerHTML=Array.from({length:total},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')+`<span>${n} / ${total}</span>`;
    },
    on(target,ev,fn,opts){ target.addEventListener(ev,fn,opts); s.disposers.push(()=>target.removeEventListener(ev,fn,opts)); },
    timeout(fn,ms){ const id=setTimeout(fn,ms); s.disposers.push(()=>clearTimeout(id)); return id; },
    interval(fn,ms){ const id=setInterval(fn,ms); s.disposers.push(()=>clearInterval(id)); return id; },
    cleanup(fn){ s.disposers.push(fn); },
    loop(fn){
      let id,last=performance.now();
      const tick=t=>{const dt=Math.min(.05,(t-last)/1000);last=t;fn(dt);id=requestAnimationFrame(tick)};
      id=requestAnimationFrame(tick);
      s.disposers.push(()=>cancelAnimationFrame(id));
    },
    win(){
      if(s.done) return; s.done=true;
      markDone(act.id); sfx.win(); api.hint('모두 성공했어요! 🎉');
      const el=document.createElement('div'); el.className='win';
      el.innerHTML=`<div class="win-card"><div class="we">🎉</div><h3 class="display">잘했어요!</h3><p>${act.title} 연습을 마쳤어요.</p><div class="win-actions"><button data-a="again">다시 하기</button><button class="main" data-a="next">다음 연습</button></div></div>`;
      stage.appendChild(el);
      el.querySelector('[data-a=again]').addEventListener('click',()=>runActivity());
      el.querySelector('[data-a=next]').addEventListener('click',()=>next());
    }
  };
  api.title(act.title,act.emoji,'');
  api.badge(act.level);
  api.mission(act.mission);
  api.mouse(act.mouse);
  api.hint('');
  api.progress(0,1);
  api.on(stage,'contextmenu',e=>e.preventDefault());
  api.on(stage,'mousedown',e=>{if(e.button===1)e.preventDefault()});
  act.start(api);
}
$('#backBtn').addEventListener('click',goHome);

{id:'path',emoji:'🚂',title:'마우스 길 열차',level:'보통',skill:'마우스 이동 (클릭 없음)',tint:'#7bd8b0',

 start(api){
  const PATHS=[
    'M 70 100 C 260 100 260 250 420 250 S 600 400 730 400',
    'M 70 90 L 330 90 C 470 90 470 230 330 230 L 200 230 C 90 230 90 400 200 400 L 730 400'
  ];
  const N=PATHS.length, STEP=10, HALF=34; const st=api.stage;
  let round=0, svg, prog, pts, idx, started, total, over=false;
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  function load(r){
    const d=PATHS[r];
    st.innerHTML=`<svg class="path-svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" role="img" aria-label="길을 따라 움직이는 연습"><path class="road" d="${d}"/><path class="road-dash" d="${d}"/><path class="road-prog" d="${d}"/><circle class="start-c" r="42"/><text class="st-t">🚂</text><text class="fin-t">🏁</text></svg>`;
    svg=$('svg',st); prog=$('.road-prog',svg);
    const road=$('.road',svg); total=road.getTotalLength(); pts=[];
    for(let l=0;l<=total;l+=STEP) pts.push(road.getPointAtLength(l));
    pts.push(road.getPointAtLength(total));
    const c=$('.start-c',svg), a=$('.st-t',svg), f=$('.fin-t',svg);
    c.setAttribute('cx',pts[0].x); c.setAttribute('cy',pts[0].y);
    a.setAttribute('x',pts[0].x); a.setAttribute('y',pts[0].y);
    const e=pts[pts.length-1]; f.setAttribute('x',e.x); f.setAttribute('y',e.y);
    idx=0; started=false;
    api.hint('🚂 위에 마우스를 올려서 출발하세요.');
    svg.addEventListener('pointermove',move);
    svg.addEventListener('pointerleave',()=>{ if(started&&!over) reset('마우스가 밖으로 나갔어요. 🚂에서 다시 출발하세요.',false) });
  }
  function toSvg(e){
    const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY;
    return p.matrixTransform(svg.getScreenCTM().inverse());
  }
  function reset(msg,fail=true){
    started=false; idx=0; svg.classList.remove('go');
    prog.style.strokeDasharray='0 99999';
    if(fail){ sfx.no(); fx(svg,'fail'); svg.classList.add('fail'); setTimeout(()=>svg&&svg.classList.remove('fail'),350); }
    api.hint(msg);
  }
  function move(e){
    if(over) return;
    const p=toSvg(e);
    if(!started){
      if(dist(p,pts[0])<46){ started=true; svg.classList.add('go'); api.hint('출발! 길 안에서 천천히 움직이세요.'); }
      return;
    }
    let k=-1,best=1e9;
    for(let i=Math.max(0,idx-10);i<Math.min(pts.length,idx+40);i++){
      const d=dist(p,pts[i]); if(d<best){best=d;k=i}
    }
    if(best>HALF){ reset('길 밖으로 나갔어요. 🚂에서 다시 출발하세요.'); return; }
    if(k>idx) idx=k;
    prog.style.strokeDasharray=`${idx*STEP} 99999`;
    if(idx>=pts.length-3){
      sfx.ok(); round++; api.progress(round,N);
      if(round>=N){over=true;api.hint('역에 도착했어요! 🏁');api.timeout(()=>api.win(),500)}
      else{api.hint('도착! 이번에는 더 구불구불한 길이에요.');over=true;api.timeout(()=>{over=false;load(round)},900)}
    }
  }
  api.progress(0,N); load(0);
 }},

/* 8. 색깔 바구니 끌어서 놓기 */
{id:'drag',emoji:'🧺',title:'색깔 바구니',level:'보통',skill:'끌어서 놓기',tint:'#ff9f6e',
 desc:'그림을 끌어서 같은 색 바구니에 놓아요.',mission:'그림을 누른 채 끌어서 같은 색 바구니에 놓으세요.',mouse:'left drag',
 start(api){
  const B=[{c:'red',n:'빨강',h:'#e63946'},{c:'yellow',n:'노랑',h:'#d99a00'},{c:'green',n:'초록',h:'#2ea44f'},{c:'blue',n:'파랑',h:'#2b6fe0'}];
  const IT=[['🍎','red'],['🍓','red'],['🍌','yellow'],['🍋','yellow'],['🥦','green'],['🐸','green'],['🐳','blue'],['💧','blue']];
  const N=IT.length; let count=0; const st=api.stage;
  st.innerHTML=`<div class="sort"><div class="baskets">${B.map(b=>`<div class="basket" data-c="${b.c}" style="--bc:${b.h}"><span class="bn">0</span><span class="in"></span><span class="bl">${b.n}</span></div>`).join('')}</div><div class="pile">${shuffle(IT).map(([e,c])=>`<div class="chip" data-c="${c}" data-e="${e}">${e}</div>`).join('')}</div></div>`;
  api.progress(0,N); api.hint('그림을 끌어서 같은 색 바구니에 놓으세요.');
  let d=null;
  const basketAt=(x,y)=>document.elementsFromPoint(x,y).find(el=>el.classList&&el.classList.contains('basket'));
  const clearHot=()=>st.querySelectorAll('.basket.hot').forEach(b=>b.classList.remove('hot'));
  api.on(st,'pointerdown',e=>{
    const it=e.target.closest('.chip'); if(!it||e.button!==0) return;
    d={it,sx:e.clientX,sy:e.clientY};
    it.classList.remove('back'); it.style.transform=''; it.classList.add('drag');
    try{it.setPointerCapture(e.pointerId)}catch(err){}
  });
  api.on(st,'pointermove',e=>{
    if(!d) return;
    d.it.style.transform=`translate(${e.clientX-d.sx}px,${e.clientY-d.sy}px) scale(1.1)`;
    clearHot(); const b=basketAt(e.clientX,e.clientY); if(b) b.classList.add('hot');
  });
  const end=e=>{
    if(!d) return;
    const it=d.it; d=null; it.classList.remove('drag'); clearHot();
    const b=e.type==='pointercancel'?null:basketAt(e.clientX,e.clientY);
    if(b&&b.dataset.c===it.dataset.c){
      sfx.ok(); it.remove(); count++;
      const inn=b.querySelector('.in'); const sp=document.createElement('span'); sp.textContent=it.dataset.e; inn.appendChild(sp);
      b.querySelector('.bn').textContent=inn.children.length; fx(b,'pop');
      api.progress(count,N); api.hint('딱 맞아요!');
      if(count>=N) api.timeout(()=>api.win(),450);
    }else{
      if(b){sfx.no();api.hint('색깔이 달라요. 같은 색 바구니를 찾아보세요.')}
      it.classList.add('back'); it.style.transform='';
    }
  };
  api.on(st,'pointerup',end); api.on(st,'pointercancel',end);
 }},

/* 9. 휠 엘리베이터 */
{id:'scroll',emoji:'🛗',title:'휠 엘리베이터',level:'보통',skill:'휠 스크롤',tint:'#8fd3f4',
 desc:'마우스 휠을 굴려 원하는 층으로 가요.',mission:'마우스 휠을 굴려 목표 층으로 가세요.',mouse:'wheel',
 start(api){
  const FL=[{e:'🏠',c:'#ffe8b6'},{e:'🍎',c:'#ffd6d6'},{e:'🐧',c:'#d6ecff'},{e:'🚀',c:'#e2dcff'},{e:'🌈',c:'#d7f5dd'}];
  const goals=[3,5,2]; let g=0, busy=false; const st=api.stage;
  const order=FL.map((f,i)=>({...f,n:i+1})).reverse();
  st.innerHTML=`<div class="goal"></div><div class="panel">${order.map(f=>`<span data-n="${f.n}">${f.n}</span>`).join('')}</div><div class="elev">${order.map(f=>`<section class="floor" style="--fc:${f.c}"><div><div class="fe">${f.e}</div><div class="fn">${f.n}층</div></div></section>`).join('')}</div>`;
  const el=$('.elev',st), goalEl=$('.goal',st), spans=st.querySelectorAll('.panel span');
  const floorNow=()=>FL.length-Math.round(el.scrollTop/el.clientHeight);
  function paint(){ const f=floorNow(); spans.forEach(s=>s.classList.toggle('here',+s.dataset.n===f)); }
  function goal(){
    const f=goals[g], c=floorNow();
    goalEl.textContent=`목표: ${f}층 ${FL[f-1].e}`;
    api.mission(`마우스 휠을 굴려 ${f}층으로 가세요.`);
    api.hint(`휠을 ${f>c?'위로':'아래로'} 굴려서 ${f}층으로 가요.`);
  }
  el.scrollTop=el.scrollHeight;
  api.progress(0,goals.length); paint(); goal();
  let tmr; api.cleanup(()=>clearTimeout(tmr));
  api.on(el,'scroll',()=>{
    paint(); clearTimeout(tmr);
    tmr=setTimeout(()=>{
      if(busy) return;
      if(floorNow()===goals[g]){
        busy=true; sfx.ok(); g++; api.progress(g,goals.length);
        if(g>=goals.length) api.timeout(()=>api.win(),400);
        else{ api.hint('도착했어요! 다음 층으로 가요.'); api.timeout(()=>{busy=false;goal()},900); }
      }
    },220);
  });
 }}
];

renderHome();
})();
</script>
